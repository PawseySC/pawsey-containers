# =============================================================================
# cavity3D strong-scaling case policy
# =============================================================================
# This declarative file supplies benchmark defaults, mesh-reuse requirements,
# and stage argument templates to the generic five-stage launcher. The launcher
# expands @NAME@ placeholders but contains no case-name branches.
CASE_CONTRACT_VERSION=1
CASE_NAME="cavity3D"
DEFAULT_CELLS_MILLIONS="64"
SUPPORTED_CELLS_MILLIONS=("64")
DEFAULT_STATS_START_TIME="0.00025"
DEFAULT_STATS_END_TIME="0.00375"
DEFAULT_CASE_END_TIME="0.00375"
DEFAULT_PREPARE_WALLTIME="00:20:00"
MESH_STATE_REQUIRED_PATHS=("0/U" "0/p" "constant/polyMesh" "system/controlDict" "system/fvSolution" "system/fvSchemes")
EXTRACT_ARGUMENT_TEMPLATE=(--campaign-dir "@WORK_ROOT@" --artifacts-dir "@CAMPAIGN_ARTIFACTS@" --foam-module "@FOAM_MODULE@" --mesh "@CELLS_MILLIONS@M" --mode fixedIter "@BENCHMARK_SOURCE_ARGS@")
MESH_ARGUMENT_TEMPLATE=(--source-case "@SOURCE_CASE_DIR@" --case-dir "@BASE_CASE_DIR@" --artifacts-dir "@CAMPAIGN_ARTIFACTS@" --expected-cells "@TARGET_CELLS@" --foam-module "@FOAM_MODULE@")
PREPARE_ARGUMENT_TEMPLATE=(--case-dir "@BASE_CASE_DIR@" --artifacts-dir "@CAMPAIGN_ARTIFACTS@" --expected-steps 15 --foam-module "@FOAM_MODULE@")
DECOMPOSE_ARGUMENT_TEMPLATE=(--prepared-case "@BASE_CASE_DIR@" --job-case "@JOB_CASE_DIR@" --job-artifacts "@JOB_ARTIFACTS@" --nodes "@NODES@" --tasks-per-node "@TASKS_PER_NODE@" --foam-module "@FOAM_MODULE@")
RUN_ARGUMENT_TEMPLATE=(--case-dir "@JOB_CASE_DIR@" --job-artifacts "@JOB_ARTIFACTS@" --nodes "@NODES@" --tasks-per-node "@TASKS_PER_NODE@" --expected-steps 15 --foam-module "@FOAM_MODULE@")
