# =============================================================================
# periodicPlaneChannel strong-scaling case policy
# =============================================================================
# This declarative file supplies scientific defaults, mesh-reuse requirements,
# and stage argument templates to the generic five-stage launcher. The launcher
# expands @NAME@ placeholders but contains no case-name branches.
CASE_CONTRACT_VERSION=1
CASE_NAME="periodicPlaneChannel"
DEFAULT_CELLS_MILLIONS="12"
SUPPORTED_CELLS_MILLIONS=("1" "3" "12")
DEFAULT_STATS_START_TIME="4"
DEFAULT_STATS_END_TIME="10"
DEFAULT_CASE_END_TIME="10.2"
DEFAULT_PREPARE_WALLTIME="00:20:00"
MESH_STATE_REQUIRED_PATHS=("0.orig/U" "0.orig/p" "constant/polyMesh" "system/controlDict" "system/fvSolution" "system/fvSchemes")
EXTRACT_ARGUMENT_TEMPLATE=("@RUNTIME_ARGS@" --recipe-dir "@RECIPE_DIR@" --work-root "@WORK_ROOT@" --test-artifacts-dir "@CAMPAIGN_ARTIFACTS@")
MESH_ARGUMENT_TEMPLATE=("@RUNTIME_ARGS@" --recipe-dir "@RECIPE_DIR@" --cells-millions "@CELLS_MILLIONS@" --work-root "@WORK_ROOT@" --test-artifacts-dir "@CAMPAIGN_ARTIFACTS@")
PREPARE_ARGUMENT_TEMPLATE=("@RUNTIME_ARGS@" --recipe-dir "@RECIPE_DIR@" --work-root "@WORK_ROOT@" --test-artifacts-dir "@CAMPAIGN_ARTIFACTS@" --start-time 0 --end-time "@CASE_END_TIME@")
DECOMPOSE_ARGUMENT_TEMPLATE=("@RUNTIME_ARGS@" --recipe-dir "@RECIPE_DIR@" --work-root "@WORK_ROOT@" --test-artifacts-dir "@JOB_ARTIFACTS@" --nodes "@NODES@" --tasks-per-node "@TASKS_PER_NODE@")
RUN_ARGUMENT_TEMPLATE=("@RUNTIME_ARGS@" --recipe-dir "@RECIPE_DIR@" --work-root "@WORK_ROOT@" --case-dir "@JOB_CASE_DIR@" --test-artifacts-dir "@JOB_ARTIFACTS@" --slurm-cpu-spreading "@CPU_SPREADING@")
