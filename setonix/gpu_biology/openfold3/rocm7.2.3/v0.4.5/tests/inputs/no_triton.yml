# Turn off the Triton kernels (the default on ROCm) so the plain PyTorch
# attention / triangle-update code paths are used instead.
model_update:
  presets:
    - predict
  custom:
    settings:
      memory:
        eval:
          use_triton_triangle_kernels: false
          use_deepspeed_evo_attention: false
          use_cueq_triangle_kernels: false
